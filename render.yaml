services:
  - type: web
    name: tulip-tea-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_HOURS
        value: 24
      - key: DEBUG
        value: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_NAME
        value: Tulip Tea Backend API
      - key: APP_VERSION
        value: 1.0.0

